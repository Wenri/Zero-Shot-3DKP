[project]
name = "zerokey"
version = "0.1.0"
description = ""
authors = [
    {name = "Bingchen Gong"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch (>=2.6.0,<3.0.0)",
    "torchvision (>=0.21.0,<0.22.0)",
    "torchaudio (>=2.6.0,<3.0.0)",
    "einops (>=0.8.1,<0.9.0)",
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}
torchvision = {source = "pytorch-cu126"}
torchaudio = {source = "pytorch-cu126"}
